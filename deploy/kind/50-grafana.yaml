apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: observability}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.observability.svc:9090
      isDefault: true
    - name: OpenSearch
      type: elasticsearch
      access: proxy
      url: http://opensearch.observability.svc:9200
      jsonData:
        timeField: observed_at
  dashboard.yaml: |
    apiVersion: 1
    providers:
    - name: salarythief
      orgId: 1
      folder: SalaryThief
      type: file
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.4
        env: [{name: GF_SECURITY_ADMIN_PASSWORD, value: admin}]
        ports: [{containerPort: 3000}]
        volumeMounts:
        - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
        - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboard.yaml, subPath: dashboard.yaml}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
      - {name: provisioning, configMap: {name: grafana-provisioning}}
      - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: observability}
spec: {type: NodePort, selector: {app: grafana}, ports: [{port: 3000, targetPort: 3000, nodePort: 30000}]}
