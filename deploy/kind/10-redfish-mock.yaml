apiVersion: apps/v1
kind: Deployment
metadata: {name: bmc-healthy-01, namespace: salarythief}
spec:
  replicas: 1
  selector: {matchLabels: {app: bmc-healthy-01}}
  template:
    metadata: {labels: {app: bmc-healthy-01}}
    spec:
      containers: [{name: mock, image: salarythief-redfish-mock:dev, imagePullPolicy: Never, env: [{name: MODE, value: healthy}], ports: [{containerPort: 8000}]}]
---
apiVersion: v1
kind: Service
metadata: {name: bmc-healthy-01, namespace: salarythief}
spec: {selector: {app: bmc-healthy-01}, ports: [{port: 8000, targetPort: 8000}]}
---
