listen: :9100
scrape_interval: 3s
scheduler:
  telemetry_interval: 3s
workers:
  telemetry: 2
retry:
  initial_backoff: 2s
  max_backoff: 8s
log_level: info

opensearch:
  enabled: true
  addresses:
    - http://opensearch.observability.svc:9200
  username: ""
  password: ""
  insecure_skip_verify: true
  inventory_index: bmc-inventory
  events_index: bmc-events

targets:
  - name: bmc-healthy-01
    endpoint: http://bmc-healthy-01.salarythief.svc:8000
    username: root
    password: "123"
    insecure_skip_verify: true
    vendor: dmtf
    timeout: 10s
    labels:
      rack: kind
      role: mock
      site: local
    collect:
      thermal: true
      power: true
      storage: true
  - name: bmc-unreachable-01
    endpoint: http://bmc-unreachable-01.salarythief.svc:8000
    username: root
    password: "123"
    insecure_skip_verify: true
    vendor: dmtf
    timeout: 10s
    labels:
      rack: kind
      role: mock
      site: local
    collect:
      thermal: true
      storage: true
  - name: bmc-slow-01
    endpoint: http://bmc-slow-01.salarythief.svc:8000
    username: root
    password: "123"
    timeout: 1s
    labels:
      observability_scope: local
      site: local
    collect:
      thermal: true
      storage: true
  - name: bmc-partial-01
    endpoint: http://bmc-partial-01.salarythief.svc:8000
    username: root
    password: "123"
    timeout: 1s
    labels:
      observability_scope: local
      site: local
    collect:
      thermal: true
      storage: true
