listen: :9100
scrape_interval: 30s
log_level: info

opensearch:
  enabled: false
  addresses:
    - https://opensearch.observability.svc:9200
  username: admin
  password: ${OPENSEARCH_PASSWORD}
  insecure_skip_verify: true
  inventory_index: bmc-inventory
  events_index: bmc-events

targets:
  - name: rack-a-compute-01
    endpoint: https://bmc-compute-01.example.com
    username: ${BMC_USERNAME}
    password: ${BMC_PASSWORD}
    insecure_skip_verify: true
    vendor: dell
    timeout: 15s
    labels:
      rack: a
      role: compute
      site: lab
    collect:
      systems: true
      chassis: true
      managers: true
      thermal: true
      power: true
